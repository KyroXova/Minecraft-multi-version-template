def metadata = new Properties()
new File(templateRoot, 'properties/mod.properties').withReader('UTF-8') { metadata.load(it) }
ext.modMetadata = metadata
group = metadata.getProperty('mod.group')
version = metadata.getProperty('mod.version')
buildDir = new File(templateRoot, targetLoader == 'core' ? 'build/core' : "build/${targetMinecraft}/${targetLoader}")
base.archivesName = "${metadata.getProperty('mod.id')}-${targetMinecraft}-${targetLoader}"

repositories { mavenCentral() }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetLoader == 'core' ? 21 : targetPins.getProperty('java.release').toInteger())
    sourceCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
    targetCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
}
sourceSets {
    main {
        java.setSrcDirs(['common/src/main/java', "versions/${targetMinecraft}/common/src/main/java", "versions/${targetMinecraft}/${targetLoader}/src/main/java"].collect { new File(templateRoot,it) })
        resources.setSrcDirs(['common/src/main/resources', "versions/${targetMinecraft}/common/src/main/resources", "versions/${targetMinecraft}/${targetLoader}/src/main/resources"].collect { new File(templateRoot,it) })
    }
    test {
        java.setSrcDirs([new File(templateRoot,'common/src/test/java')])
        resources.setSrcDirs([new File(templateRoot,'common/src/test/resources')])
    }
}
dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    exclude '**/.gitkeep'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    def values = [mod_id: metadata.getProperty('mod.id'), mod_name: metadata.getProperty('mod.name'), mod_version: version.toString(), mod_description: metadata.getProperty('mod.description'), mod_license: metadata.getProperty('mod.license'), minecraft_version: targetMinecraft, java_release: targetPins.getProperty('java.release'), loader_version: targetPins.getProperty("${targetLoader}.version", '')]
    inputs.properties(values)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand(values) }
}
jar {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(new File(templateRoot,'LICENSE'))
    manifest { attributes('Implementation-Version': project.version) }
}
test { maxParallelForks = 2 }
