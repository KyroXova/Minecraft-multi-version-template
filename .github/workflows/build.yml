name: Build targets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/kyro/template.py validate
      - run: python tools/kyro/test_tools.py
      - run: python tools/kyro/test_storage.py
      - id: targets
        shell: python
        run: |
          import json, os
          data = json.load(open('targets.json'))
          matrix = {'include': [{'mc': t['minecraft'], 'loader': loader} for t in data['targets'] for loader in t['loaders']]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/kyro/template.py core
  build:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '8'
      - run: echo "JAVA_8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '16'
      - run: echo "JAVA_16_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "JAVA_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "JAVA_21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - run: echo "JAVA_25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - id: verify
        run: python tools/kyro/verify.py --target "${{ matrix.mc }}/${{ matrix.loader }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mod-${{ matrix.mc }}-${{ matrix.loader }}
          path: ${{ steps.verify.outputs.jar }}
          if-no-files-found: error
